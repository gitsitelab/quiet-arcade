# Builds and publishes the site to GitHub Pages on every change to main.
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Join the game file and check it is exact
        run: |
          mkdir -p _site
          cat src/part*.html > _site/index.html
          echo "$(cat src/index.sha256)  _site/index.html" | sha256sum -c -
      - name: Copy the other files
        run: cp manifest.webmanifest sw.js _site/
      - name: Draw the app icons
        run: |
          pip install pillow
          python tools/make_icons.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
